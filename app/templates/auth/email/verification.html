<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="MTA Company">
  <title>Verify your e-mail</title>
</head>
<body style="margin:0;padding:24px;background:#f5f6fa;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#14172a;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;border:1px solid #e3e6ef;">
    <h1 style="margin-top:0;font-size:22px;">Confirm your e-mail 📬</h1>
    <p>Hi <strong>{{ user.effective_name }}</strong>,</p>
    <p>Welcome to <strong>MyDoc</strong>! Please confirm your e-mail address by clicking the button below.</p>
    <p style="text-align:center;margin:28px 0;">
      <a href="{{ link }}"
         style="background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;display:inline-block;">
        Verify my e-mail
      </a>
    </p>
    <p style="color:#6b7089;font-size:13px;">If the button doesn't work, copy and paste this link into your browser:</p>
    <p style="font-size:13px;word-break:break-all;"><a href="{{ link }}">{{ link }}</a></p>
    <hr style="border:none;border-top:1px solid #e3e6ef;margin:24px 0;">
    <p style="color:#6b7089;font-size:12px;margin-bottom:0;">&copy; MyDoc — Developed by MTA Company</p>
  </div>
</body>
</html>
